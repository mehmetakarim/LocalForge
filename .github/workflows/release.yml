name: Release & Packaging

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build macOS DMG & Binaries
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri Desktop Application (DMG)
        working-directory: apps/desktop
        run: npx tauri build

      - name: Build CLI & MCP Standalone Binaries (Release)
        run: |
          cargo build --release -p localforge-cli -p localforge-mcp-server
          mkdir -p release-artifacts
          cp target/release/localforge release-artifacts/localforge-cli-darwin-arm64
          cp target/release/localforge-mcp release-artifacts/localforge-mcp-darwin-arm64

      - name: Collect DMG Artifact
        run: |
          cp target/release/bundle/dmg/*.dmg release-artifacts/ || true

      - name: Compute SHA-256 Checksums
        working-directory: release-artifacts
        run: |
          shasum -a 256 * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
