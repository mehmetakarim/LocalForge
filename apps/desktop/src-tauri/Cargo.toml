[package]
name = "localforge-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Mehmet Akar <mehmetakarim@gmail.com>"]

[lib]
name = "localforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

localforge-core = { path = "../../../crates/core" }
localforge-platform = { path = "../../../crates/platform" }
localforge-storage = { path = "../../../crates/storage" }
localforge-project-manager = { path = "../../../crates/project-manager" }
localforge-runtime = { path = "../../../crates/runtime" }

